<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="412" height="200" viewBox="0 0 412 200" role="img" aria-labelledby="title desc">
  <title id="title">Languages</title>
  <desc id="desc">Language bytes across public personal repos: JavaScript 44%, TypeScript 31%, Python 24%, Shell 1%.</desc>
  <style>
    .frame { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .t { fill: #1f2328; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #656d76; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .n { fill: #1f2328; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .k { fill: #656d76; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .f { fill: #656d76; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .l { fill: #1f2328; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p { fill: #656d76; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar { fill: #3fb950; }
    .base { stroke: #d0d7de; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0d1117; stroke: #30363d; }
      .t { fill: #e6edf3; }
      .m { fill: #8b949e; }
      .n { fill: #e6edf3; }
      .k { fill: #8b949e; }
      .f { fill: #8b949e; }
      .l { fill: #e6edf3; }
      .p { fill: #8b949e; }
      .base { stroke: #30363d; }
    }
  </style>
  <rect class="frame" x="0.5" y="0.5" width="411" height="199" rx="10"/>
  <text class="t" x="24" y="34">Languages</text>
  <text class="m" x="388" y="34" text-anchor="end">last 12 months</text>
  <defs>
    <clipPath id="barClip">
      <rect x="24" y="50" width="364" height="10" rx="5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#barClip)">
    <rect x="24" y="50" width="160" height="10" fill="#f1e05a"/><rect x="184" y="50" width="113" height="10" fill="#3178c6"/><rect x="297" y="50" width="87" height="10" fill="#3572A5"/><rect x="384" y="50" width="4" height="10" fill="#89e051"/>
  </g>
  <circle cx="30" cy="88" r="4" fill="#f1e05a"/>
  <text class="l" x="42" y="92">JavaScript</text>
  <text class="p" x="190" y="92" text-anchor="end">44%</text>
  <circle cx="30" cy="114" r="4" fill="#3178c6"/>
