  <text class="p" x="190" y="118" text-anchor="end">31%</text>
  <circle cx="30" cy="140" r="4" fill="#3572A5"/>
  <text class="l" x="42" y="144">Python</text>
  <text class="p" x="190" y="144" text-anchor="end">24%</text>
  <circle cx="222" cy="88" r="4" fill="#89e051"/>
