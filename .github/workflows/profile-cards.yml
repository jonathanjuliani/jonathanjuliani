name: profile-cards
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm cards
        env:
          GH_LOGIN: jonathanjuliani
          GH_TOKEN: ${{ secrets.CARDS_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "profile-cards[bot]"
          git config user.email "profile-cards@users.noreply.github.com"
          git add assets/activity.svg assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
